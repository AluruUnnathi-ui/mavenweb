services:

  db:
    image: mysql:8.0
    container_name: metro-db
    restart: always

    environment:
      MYSQL_ROOT_PASSWORD: root123
      MYSQL_DATABASE: metro
      MYSQL_USER: metrouser
      MYSQL_PASSWORD: metro123

    volumes:
      - mysql-data:/var/lib/mysql

    networks:
      - metro-net

  app:
    build: .
    container_name: metro-app
    restart: always

    ports:
      - "8081:8080"

    depends_on:
      - db

    networks:
      - metro-net

volumes:
  mysql-data:
    external: true

networks:
  metro-net:
    external: true